[package]
name = "smartrender"
version = "0.1.0"
description = "Conversor de vídeo inteligente: escolhe GPU, CPU ou as duas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A versão 1.2+ usa o ICU4X, cujos scripts de build o antivírus (Panda) bloqueia nesta máquina.
# A 1.1 faz o mesmo trabalho (nomes de domínio internacionais) com a biblioteca unicode-rs.
idna_adapter = "=1.1.0"

[profile.release]
strip = true
